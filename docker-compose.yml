services:
  # ===========================================================================
  # PostgreSQL 16 — user, product, cart, order, payment
  # ===========================================================================
  postgres:
    image: postgres:15-alpine
    container_name: kotoha-postgres
    environment:
      POSTGRES_USER: kotoha
      POSTGRES_PASSWORD: 253121
      POSTGRES_DB: kotoha
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kotoha"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ===========================================================================
  # Redis 7 — session, cart cache, rate limit, hot search cache
  # ===========================================================================
  redis:
    image: redis:6-alpine
    container_name: kotoha-redis
    command: redis-server --requirepass 253121
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--pass", "253121", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ===========================================================================
  # etcd — Milvus metadata storage
  # ===========================================================================
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: kotoha-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    ports:
      - "2379:2379"
    volumes:
      - etcd_data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  # ===========================================================================
  # MinIO — object storage (Milvus internal + Kotoha product images)
  # ===========================================================================
  minio:
    image: minio/minio:latest
    container_name: kotoha-minio
    environment:
      MINIO_ROOT_USER: kotoha
      MINIO_ROOT_PASSWORD: 25312100
    command: minio server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web Console (http://localhost:9001)
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  # ===========================================================================
  # MinIO bucket init — pre-create kotoha-images bucket
  # ===========================================================================
  minio-init:
    image: minio/mc:latest
    container_name: kotoha-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set kotoha http://minio:9000 kotoha 25312100;
      mc mb --ignore-existing kotoha/kotoha-images;
      mc anonymous set download kotoha/kotoha-images;
      echo 'MinIO bucket kotoha-images ready';
      exit 0;
      "

  # ===========================================================================
  # Milvus 2.4 — vector database (product embedding + hybrid search)
  # ===========================================================================
  milvus:
    image: milvusdb/milvus:v2.4.0
    container_name: kotoha-milvus
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: kotoha
      MINIO_SECRET_ACCESS_KEY: 25312100
      COMMON_STORAGETYPE: remote
    command: ["milvus", "run", "standalone"]
    ports:
      - "19530:19530"  # gRPC
      - "9091:9091"    # health check / metrics
    volumes:
      - milvus_data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  etcd_data:
  minio_data:
  milvus_data:
