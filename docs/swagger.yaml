        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_catalog.Product'
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      summary: Get product by ID
      tags:
      - catalog
  /catalog/search:
    get:
      parameters:
      - description: Search query
        in: query
        name: q
        required: true
        type: string
      - default: 10
        description: Max results
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: 'Search products (hybrid: dense + BM25)'
      tags:
      - catalog
  /eval/runs:
    get:
      parameters:
      - description: Filter by category
        in: query
        name: category
        type: string
      - default: 20
        description: Max results
        in: query
        name: limit
