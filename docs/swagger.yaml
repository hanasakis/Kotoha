basePath: /api/v1
definitions:
  github_com_hanasakis_kotoha_pkg_ollama.Message:
    properties:
      content:
        type: string
      role:
        type: string
      tool_calls:
        items:
          $ref: '#/definitions/github_com_hanasakis_kotoha_pkg_ollama.ToolCall'
        type: array
    type: object
  github_com_hanasakis_kotoha_pkg_ollama.ToolCall:
    properties:
      function:
        $ref: '#/definitions/github_com_hanasakis_kotoha_pkg_ollama.ToolCallFunction'
    type: object
  github_com_hanasakis_kotoha_pkg_ollama.ToolCallFunction:
    properties:
      arguments:
        additionalProperties: true
        type: object
      name:
        type: string
    type: object
  internal_auth.DeleteAccountInput:
    properties:
      password:
        type: string
    required:
    - password
    type: object
  internal_auth.ForgotPasswordInput:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  internal_auth.LoginInput:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  internal_auth.RegisterInput:
    properties:
      email:
        type: string
      nickname:
        type: string
      password:
        minLength: 6
        type: string
    required:
    - email
    - password
    type: object
  internal_auth.ResetPasswordInput:
    properties:
      new_password:
        minLength: 6
        type: string
      token:
        type: string
    required:
    - new_password
    - token
    type: object
  internal_cart.AddItemReq:
    properties:
      quantity:
        minimum: 1
        type: integer
      sku_id:
        type: integer
    required:
    - quantity
    - sku_id
    type: object
  internal_cart.UpdateQtyReq:
    properties:
      quantity:
        minimum: 1
        type: integer
    required:
    - quantity
    type: object
  internal_catalog.Category:
    properties:
      created_at:
        type: string
      id:
        type: integer
      name:
        type: string
      name_en:
        type: string
      parent_id:
        type: integer
      sort_order:
        type: integer
      updated_at:
        type: string
    type: object
  internal_catalog.Product:
    properties:
      allergens:
        type: string
      buy_count:
        type: integer
      category_id:
        type: integer
      click_count:
        type: integer
      created_at:
        type: string
      description:
        type: string
      description_en:
        type: string
      id:
        type: integer
      image_url:
        type: string
      ingredients:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      name_en:
        type: string
      scenes:
        type: string
      shelf_days:
        type: integer
      skus:
        items:
          $ref: '#/definitions/internal_catalog.SKU'
        type: array
      tags:
        type: string
      taste:
        type: string
      updated_at:
        type: string
      weight_gram:
        type: integer
    type: object
  internal_catalog.SKU:
    properties:
      created_at:
        type: string
      id:
        type: integer
      image_url:
        type: string
      is_default:
        type: boolean
      name:
        type: string
      price:
        type: integer
      product_id:
        type: integer
      stock:
        type: integer
      updated_at:
        type: string
    type: object
  internal_observability.ChatRequest:
    properties:
      history:
        items:
          $ref: '#/definitions/github_com_hanasakis_kotoha_pkg_ollama.Message'
        type: array
      message:
        type: string
    required:
    - message
    type: object
  internal_observability.EvalRun:
    properties:
      accuracy:
        type: number
      category:
        type: string
      created_at:
        type: string
      failed:
        type: integer
      id:
        type: integer
      metrics:
        description: JSON blob for detailed metrics
        type: string
      passed:
        type: integer
      total_tests:
        type: integer
    type: object
  internal_order.CreateOrderInput:
    properties:
      address_id:
        type: integer
      note:
        type: string
    required:
    - address_id
    type: object
  internal_order.Order:
    properties:
      created_at:
        type: string
      currency:
        type: string
      id:
        type: integer
      items:
        items:
          $ref: '#/definitions/internal_order.OrderItem'
        type: array
      order_no:
        type: string
      paid_at:
        type: string
      status:
        type: string
      stripe_session_id:
        type: string
      total_amount:
        type: integer
      updated_at:
        type: string
      user_id:
        type: integer
    type: object
  internal_order.OrderItem:
    properties:
      id:
        type: integer
      name:
        type: string
      order_id:
        type: integer
      price:
        type: integer
      product_id:
        type: integer
      quantity:
        type: integer
      sku_id:
        type: integer
    type: object
  internal_payment.CheckoutInput:
    properties:
      cancel_url:
        type: string
      idempotency_key:
        type: string
      success_url:
        type: string
    required:
    - cancel_url
    - success_url
    type: object
  internal_user.Address:
    properties:
      city:
        type: string
      created_at:
        type: string
      detail:
        type: string
      district:
        type: string
      id:
        type: integer
      is_default:
        type: boolean
      name:
        type: string
      phone:
        type: string
      province:
        type: string
      updated_at:
        type: string
      user_id:
        type: integer
    type: object
  internal_user.Preference:
    properties:
      allergens:
        type: string
      dietary_limits:
        type: string
      id:
        type: integer
      scene_prefs:
        type: string
      taste_prefs:
        type: string
      user_id:
        type: integer
    type: object
  internal_user.Profile:
    properties:
      avatar:
        type: string
      created_at:
        type: string
      id:
        type: integer
      phone:
        type: string
      updated_at:
        type: string
      user_id:
        type: integer
    type: object
host: localhost:8080
info:
  contact: {}
  description: AI-powered snack e-commerce platform with hybrid search, conversational
    agent, and Stripe payments.
  title: Kotoha API
  version: "1.0"
paths:
  /addresses:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_user.Address'
            type: array
      security:
      - BearerAuth: []
      summary: List user addresses
      tags:
      - profile
    post:
      consumes:
      - application/json
      parameters:
      - description: Address data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_user.Address'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_user.Address'
      security:
      - BearerAuth: []
      summary: Create a new address
      tags:
      - profile
  /addresses/{id}:
    delete:
      parameters:
      - description: Address ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Delete an address
      tags:
      - profile
    put:
      consumes:
      - application/json
      parameters:
      - description: Address ID
        in: path
        name: id
        required: true
        type: integer
      - description: Updated address data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_user.Address'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_user.Address'
      security:
      - BearerAuth: []
      summary: Update an address
      tags:
      - profile
  /admin/products:
    post:
      consumes:
      - application/json
      parameters:
      - description: Product data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_catalog.Product'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_catalog.Product'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Create a product (admin)
      tags:
      - admin
  /admin/products/{id}:
    delete:
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Delete a product (admin)
      tags:
      - admin
    put:
      consumes:
      - application/json
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: integer
      - description: Updated product data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_catalog.Product'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_catalog.Product'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Update a product (admin)
      tags:
      - admin
  /admin/search/index:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Re-index all products into Milvus (admin)
      tags:
      - admin
  /agent/chat:
    post:
      consumes:
      - application/json
      parameters:
      - description: Chat message and history
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_observability.ChatRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Chat with AI shopping assistant
      tags:
      - agent
  /auth/account:
    delete:
      consumes:
      - application/json
      parameters:
      - description: Current password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_auth.DeleteAccountInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Delete account (soft delete)
      tags:
      - auth
  /auth/forgot-password:
    post:
      consumes:
      - application/json
      parameters:
      - description: Email address
        in: body
        name: body
        required: true
        schema:
