      tags:
      - cart
  /catalog/categories:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_catalog.Category'
            type: array
      summary: List all categories
      tags:
      - catalog
  /catalog/products:
    get:
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Items per page
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: List products with pagination
      tags:
      - catalog
  /catalog/products/{id}:
    get:
      parameters:
