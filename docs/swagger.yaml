      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_observability.EvalRun'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Save an evaluation run
      tags:
      - observability
  /metrics:
    get:
      produces:
      - application/json
      responses:
        "200":
