  /preferences:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_user.Preference'
      security:
      - BearerAuth: []
      summary: Get user preferences
      tags:
      - profile
    put:
      consumes:
      - application/json
      parameters:
      - description: Preference data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_user.Preference'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_user.Preference'
      security:
      - BearerAuth: []
      summary: Update user preferences
      tags:
      - profile
  /profile:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_user.Profile'
      security:
      - BearerAuth: []
      summary: Get user profile
      tags:
      - profile
    put:
      consumes:
      - application/json
      parameters:
      - description: Profile data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_user.Profile'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_user.Profile'
      security:
      - BearerAuth: []
      summary: Update user profile
      tags:
      - profile
  /webhook:
    post:
      consumes:
      - application/json
      parameters:
      - description: Stripe webhook signature
        in: header
        name: Stripe-Signature
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
